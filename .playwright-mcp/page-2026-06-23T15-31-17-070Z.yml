  - generic [ref=e42]:
    - generic [ref=e43]:
      - heading "1. Information We Collect" [level=2] [ref=e44]
      - paragraph [ref=e45]: 1st Texas Realtors ("we," "us," or "our") collects information you voluntarily provide when you contact us, fill out a form, or request information about our services. This may include your name, email address, phone number, and details about your real estate needs.
      - paragraph [ref=e46]: We may also automatically collect certain information when you visit our website, including your IP address, browser type, and pages visited, through standard web server logs and analytics tools.
    - generic [ref=e47]:
      - heading "2. How We Use Your Information" [level=2] [ref=e48]
      - paragraph [ref=e49]: "We use the information we collect to:"
      - list [ref=e50]:
        - listitem [ref=e51]: Respond to your inquiries and provide real estate services
        - listitem [ref=e52]: Send you relevant property listings and market updates (with your consent)
        - listitem [ref=e53]: Improve our website and services
        - listitem [ref=e54]: Comply with legal obligations
      - paragraph [ref=e55]: We do not sell, rent, or trade your personal information to third parties for their marketing purposes.
    - generic [ref=e56]:
      - heading "3. Information Sharing" [level=2] [ref=e57]
      - paragraph [ref=e58]: We may share your information with trusted service providers who assist us in operating our website and conducting our business, as long as those parties agree to keep this information confidential. We may also disclose your information when required by law or to protect our rights.
    - generic [ref=e59]:
      - heading "4. MLS Data" [level=2] [ref=e60]
      - paragraph [ref=e61]: Property listing data is provided by the Houston Association of Realtors (HAR) and the Houston MLS. This data is subject to HAR's terms of use and may not be used for any commercial purpose without prior written authorization. Listing information is provided for consumers' personal, non-commercial use.
    - generic [ref=e62]:
      - heading "5. Cookies" [level=2] [ref=e63]
      - paragraph [ref=e64]: Our website may use cookies to enhance your browsing experience. You can choose to disable cookies through your browser settings, though this may affect some functionality of our website.
    - generic [ref=e65]:
      - heading "6. Data Security" [level=2] [ref=e66]
      - paragraph [ref=e67]: We implement appropriate security measures to protect your personal information from unauthorized access, alteration, disclosure, or destruction. However, no method of transmission over the internet is 100% secure, and we cannot guarantee absolute security.
    - generic [ref=e68]:
      - heading "7. Your Rights" [level=2] [ref=e69]
      - paragraph [ref=e70]: You may request to access, correct, or delete the personal information we hold about you at any time by contacting us at the information below. We will respond to your request within 30 days.
    - generic [ref=e71]:
      - heading "8. Texas Real Estate Commission" [level=2] [ref=e72]
      - paragraph [ref=e73]: "1st Texas Realtors is licensed by the Texas Real Estate Commission (TREC). For information about brokerage services and consumer protections, please review:"
      - list [ref=e74]:
        - listitem [ref=e75]: TREC Information About Brokerage Services
        - listitem [ref=e76]: TREC Consumer Protection Notice
