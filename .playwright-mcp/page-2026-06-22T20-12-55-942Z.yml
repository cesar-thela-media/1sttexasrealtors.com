        - heading "Common Questions" [level=2] [ref=e87]
      - generic [ref=e88]:
        - generic [ref=e89]:
          - heading "Do I need to be pre-approved before we start looking?" [level=3] [ref=e90]
          - paragraph [ref=e91]: Not necessarily, but we recommend it. A pre-approval letter shows sellers you're serious and helps us narrow your search to homes in your actual price range. We can refer you to local lenders we trust.
        - generic [ref=e92]:
          - heading "How long does it usually take to find and close on a home?" [level=3] [ref=e93]
          - paragraph [ref=e94]: It varies. Some buyers find the right home in a few weekends; others take a few months. Closing typically takes 30–45 days once you're under contract. We'll help you plan for your timeline.
        - generic [ref=e95]:
          - heading "Does it cost me anything to use a buyer's agent?" [level=3] [ref=e96]
          - paragraph [ref=e97]: In most cases, the seller pays the buyer's agent commission — meaning our services are effectively free to you as a buyer. We'll always be transparent about how compensation works in any specific deal.
        - generic [ref=e98]:
          - heading "What areas do you cover?" [level=3] [ref=e99]
          - paragraph [ref=e100]: We specialize in Clear Lake, Seabrook, El Lago, Nassau Bay, Taylor Lake Village, Kemah, Webster, League City, Friendswood, and surrounding communities in southeast Houston.
