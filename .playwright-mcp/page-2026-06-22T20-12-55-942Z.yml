      - generic [ref=e57]:
        - generic [ref=e58]:
          - generic [ref=e59]: "01"
          - generic [ref=e60]:
            - heading "Tell Us What You Need" [level=3] [ref=e61]
            - paragraph [ref=e62]: We start with a no-pressure conversation to understand your budget, timeline, must-haves, and which communities feel right. No forms, no algorithms — just a real conversation.
        - generic [ref=e63]:
          - generic [ref=e64]: "02"
          - generic [ref=e65]:
            - heading "We Search the Full Market" [level=3] [ref=e66]
            - paragraph [ref=e67]: We have access to every listing — MLS, off-market, and coming-soon properties that most buyers never see. We filter so you only spend time on homes that are actually worth your time.
        - generic [ref=e68]:
          - generic [ref=e69]: "03"
          - generic [ref=e70]:
            - heading "Tour With Local Eyes" [level=3] [ref=e71]
            - paragraph [ref=e72]: We don't just open doors. We walk you through every detail — the school zones, the flood history, the neighbors, the commute. Nothing gets glossed over.
        - generic [ref=e73]:
          - generic [ref=e74]: "04"
          - generic [ref=e75]:
            - heading "Negotiate Hard for You" [level=3] [ref=e76]
            - paragraph [ref=e77]: We know what homes are really worth around here. We'll write a strong offer and negotiate on your behalf — price, repairs, closing costs, timeline. Everything.
        - generic [ref=e78]:
          - generic [ref=e79]: "05"
          - generic [ref=e80]:
            - heading "Close With Confidence" [level=3] [ref=e81]
            - paragraph [ref=e82]: We coordinate every step of closing — inspections, title, lender, survey — so nothing surprises you at the table. After closing, we're still your neighbors.
    - generic [ref=e84]:
