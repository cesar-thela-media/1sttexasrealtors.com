          - text: since the beginning.
        - generic [ref=e51]:
          - paragraph [ref=e52]: "Mark and Sandra started 1st Texas Realtors in 2004 with one simple idea: be the Realtors they'd want if they were buying or selling. No high-pressure tactics, no hand-offs to assistants, no disappearing after the contract."
          - paragraph [ref=e53]: They grew up on the Clear Lake peninsula, raised their family here, and have watched the community grow for decades. That lived experience shapes every recommendation they make — from which streets have the best schools to which neighborhoods flood.
          - paragraph [ref=e54]: Today, more than half of their business comes from past clients and personal referrals. That's the metric they're most proud of.
