  - generic [ref=e49]:
    - paragraph [ref=e50]: What Most New Construction Buyers Don't Know Until It's Too Late
    - generic [ref=e51]:
      - generic [ref=e52]:
        - img [ref=e54]
        - paragraph [ref=e56]: Once you register at a model home without an agent, you may lose your right to representation.
      - generic [ref=e57]:
        - img [ref=e59]
        - paragraph [ref=e61]: Builder contracts are written to protect the builder — not you. Every clause needs review.
      - generic [ref=e62]:
        - img [ref=e64]
        - paragraph [ref=e66]: Upgrade packages are often marked up 40–60% above what the same item costs after closing.
      - generic [ref=e67]:
        - img [ref=e69]
        - paragraph [ref=e71]: Builder financing incentives often come with strings that cost you more in the long run.
  - generic [ref=e73]:
    - generic [ref=e74]:
      - img "New home construction" [ref=e75]
      - paragraph [ref=e77]: We've helped dozens of buyers through new construction — we know every builder in this market.
    - generic [ref=e78]:
      - paragraph [ref=e79]: 20 Years of Local Knowledge
      - heading "We know the builders, the traps, and the leverage." [level=2] [ref=e80]:
        - text: We know the builders,
        - text: the traps, and the leverage.
      - paragraph [ref=e81]: We've been navigating new construction deals in the Clear Lake area for over 20 years. We know which builders deliver quality, which ones have the best warranty programs, and which upgrade packages are pure profit margin.
      - paragraph [ref=e82]: Most buyers think buying new means buying simple. Then they get to closing and realize they over-paid on upgrades, missed better lot options, or signed a contract clause that cost them. We prevent all of that.
  - generic [ref=e84]:
    - generic [ref=e85]:
      - paragraph [ref=e86]: How We Help
      - heading "What we do for new construction buyers" [level=2] [ref=e87]
    - generic [ref=e88]:
      - generic [ref=e89]:
        - generic [ref=e90]: ⚖️
        - generic [ref=e91]:
          - heading "We Represent You, Not the Builder" [level=3] [ref=e92]
          - paragraph [ref=e93]: The on-site sales agent works for the builder. We work for you. That means we read every contract line, push back on inflated upgrades, and make sure you're not leaving money on the table.
      - generic [ref=e94]:
        - generic [ref=e95]: 🏗️
        - generic [ref=e96]:
          - heading "We Know Which Builders to Trust" [level=3] [ref=e97]
          - paragraph [ref=e98]: After 20 years, we've seen how each builder in this market performs — quality of materials, responsiveness on warranty claims, on-time delivery. We'll steer you toward the ones who follow through.
      - generic [ref=e99]:
        - generic [ref=e100]: 💬
        - generic [ref=e101]:
          - heading "Negotiation Doesn't Stop at Price" [level=3] [ref=e102]
          - paragraph [ref=e103]: Builders often won't move on price but will include free upgrades, cover closing costs, or upgrade your lot. We know what to ask for and when to ask for it.
      - generic [ref=e104]:
        - generic [ref=e105]: 🔍
        - generic [ref=e106]:
          - heading "Inspection at Every Phase" [level=3] [ref=e107]
          - paragraph [ref=e108]: We recommend a third-party inspector at foundation, framing, and final walkthrough — not just at closing. We'll coordinate this and make sure punch list items get fixed before you close.
